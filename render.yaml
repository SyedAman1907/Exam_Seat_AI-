services:
  - type: web
    name: examseat-ai
    runtime: node
    plan: free
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://exam-seat-ai-eta.vercel.app
      - key: CORS_ORIGINS
        value: https://exam-seat-ai-eta.vercel.app,https://examseatai.vercel.app
      - key: CORS_VERCEL_PROJECTS
        value: exam-seat,exam-seat-ai,examseatai
      - key: CORS_VERCEL_SCOPES
        value: syedaman1907s-projects
      - key: MONGO_MAX_POOL_SIZE
        value: "50"
      - key: MONGO_MIN_POOL_SIZE
        value: "10"
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: INCHARGE_EMAIL
        sync: false
      - key: INCHARGE_PASSWORD
        sync: false
