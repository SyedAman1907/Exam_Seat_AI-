services:
  - type: web
    name: examseat-ai
    runtime: node
    plan: free
    buildCommand: cd server && npm install && cd ../client && npm install && npm run build
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://exam-seat-ai-eta.vercel.app
      - key: CORS_ORIGINS
        value: https://exam-seat-ai-eta.vercel.app
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: INCHARGE_EMAIL
        sync: false
      - key: INCHARGE_PASSWORD
        sync: false
